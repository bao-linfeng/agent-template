# Local container mode only (root docker-compose.yml): replaces deploy/nginx/spa.conf in the admin and client
# images. The SPA calls the API on its own origin and nginx forwards /api/ to the api container, so the
# browser needs no CORS and the production CSP (https-only API origin) does not get in the way over http.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    # Above UPLOAD_MAX_BYTES (20 MB by default).
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:3020;
        proxy_http_version 1.1;
        # Keep the port: the API builds absolute links from the request host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Server-sent events and long downloads.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
