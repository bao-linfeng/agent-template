# Local infrastructure for apps/server. The Nest app itself runs on the host (`pnpm -C apps/server dev`).
# Compose reads variables from apps/server/.env, so ports and credentials stay in sync with the app config.
# PostgreSQL (pgvector) and Redis are not here: they come from the shared infrastructure project D:/baolf/infra
# (`docker compose up -d --wait` there), used by several projects; this app owns the `app` database and Redis db 2.
#
#   docker compose up -d                 # silo + mailpit
#   docker compose --profile ai up -d    # also start Ollama for local bge-m3 embeddings
#   docker compose --profile observability up -d   # also Prometheus, Alertmanager, Tempo and Grafana
#   docker compose --profile antivirus up -d       # also clamd for the upload malware scan (CLAMAV_HOST=localhost)
#
# Profiles can also be set once in .env (COMPOSE_PROFILES=observability), then `pnpm infra:up`/`infra:down` include them.
name: agent-template-server

services:
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: [server, /data, --console-address, ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-siloadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-siloadmin}
    ports:
      - '${SILO_PORT:-9000}:9000' # S3 API
      - '${SILO_CONSOLE_PORT:-9001}:9001' # Web console
    volumes:
      - silo-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches all outgoing mail in development; inbox UI at http://localhost:8025.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  ollama:
    # Optional local embedding server. After start: docker compose exec ollama ollama pull bge-m3
    image: ollama/ollama:latest
    profiles: ['ai']
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama

  clamav:
    # Optional malware scan of uploads: set CLAMAV_HOST=localhost. The first start downloads the signature
    # database (a few hundred MB) and takes a few minutes until healthy; clamd then needs ~1.5 GB RAM.
    image: clamav/clamav:1.4
    profiles: ['antivirus']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav

  # --- Monitoring (profile `observability`): the production stack of deploy/observability, wired to the host API ---
  # Same rules, dashboard and Tempo settings as deploy/docker-compose.yml (keep the image versions equal).
  # Prometheus scrapes the API's METRICS_PORT on the host; alert mail goes to Mailpit; traces need the
  # preload (pnpm build && pnpm start:prod) with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  # Ports are bound to 127.0.0.1: Grafana signs everybody in as admin.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ['observability']
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.local.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ../../deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ['observability']
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/alertmanager/entrypoint.sh']
    # Mail only (Mailpit); the IM bots go through alert-relay, which only the production stack runs.
    environment:
      ALERT_EMAIL_TO: ops@localhost
      ALERT_EMAIL_FROM: Alertmanager <alertmanager@localhost>
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      ALERT_SMTP_REQUIRE_TLS: 'false'
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ../../deploy/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - mailpit
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:9093/-/ready']
      interval: 10s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:3.1.0
    profiles: ['observability']
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/tempo.yaml', '-config.expand-env=true']
    environment:
      TEMPO_RETENTION: 72h
    ports:
      - '127.0.0.1:${TEMPO_OTLP_PORT:-4318}:4318' # OTLP http
    volumes:
      - ../../deploy/observability/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ['observability']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3300}:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api.json
    volumes:
      - ../../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test:
        ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  silo-data:
  ollama-data:
  clamav-data:
  prometheus-data:
  alertmanager-data:
  tempo-data:
  grafana-data:
