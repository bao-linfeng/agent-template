# Local container mode: builds and runs the whole app in Docker, like `pnpm dev` but without host processes.
#
#   docker compose up -d --build --wait     # api + admin + client, plus Silo / Mailpit from apps/server
#   docker compose down                     # stop (volumes are kept)
#
# PostgreSQL (pgvector) and Redis come from the shared infrastructure D:/baolf/infra (start it first; this app
# owns the `app` database and Redis db 2). Configuration is apps/server/.env, shared with `pnpm dev`; localhost
# dependency URLs in it are pointed at the Docker host inside the api container (apps/server/docker/loopback-hosts.mjs).
# Do not run this and `pnpm dev` at the same time: both use port 3020 and the same queues.
#
#   API http://localhost:3020/api   admin http://localhost:5021   client http://localhost:5020
#
# The project name matches apps/server/docker-compose.yml, so `pnpm infra:up` and this file share the same
# Silo / Mailpit containers and volumes instead of starting a second copy.
name: agent-template-server

include:
  - path: apps/server/docker-compose.yml
    env_file: apps/server/.env

x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
    target: local
  image: agent-template-server-local
  env_file: apps/server/.env
  environment:
    # The admin and client nginx forward /api/ here; trust them for client IPs (rate limits, sessions).
    TRUST_PROXY: "true"
    APP_WEB_URL: http://localhost:5021
    CORS_ORIGINS: http://localhost:5021,http://localhost:5020
    # Tempo only runs with the observability profile; enable tracing there with `pnpm dev` instead.
    OTEL_SDK_DISABLED: "true"
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true

services:
  migrate:
    <<: *server
    command: ["node", "--import", "./docker/loopback-hosts.mjs", "dist/scripts/migrate.js"]
    restart: "no"

  api:
    <<: *server
    ports:
      - 127.0.0.1:3020:3020
      # Prometheus metrics for the local observability profile (scrapes host.docker.internal:9464).
      - 127.0.0.1:9464:9464
    depends_on:
      migrate:
        condition: service_completed_successfully
      silo:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Readiness: database and Redis.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Same origin: nginx forwards /api/ to the api container (docker/nginx-local.conf).
        VITE_SERVER_API_URL: http://localhost:5021
        VITE_SERVER_API_PREFIX: /api
    image: agent-template-admin-local
    ports:
      - 127.0.0.1:5021:8080
    volumes:
      - ./docker/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5020/api
    image: agent-template-client-local
    ports:
      - 127.0.0.1:5020:8080
    volumes:
      - ./docker/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
