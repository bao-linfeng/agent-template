# Tempo 3 in monolithic mode (`-target=all`, no Kafka) with traces on the local volume `tempo-data`.
# The API exports OTLP/HTTP to http://tempo:4318 (OTEL_EXPORTER_OTLP_ENDPOINT in deploy/.env); Grafana queries :3200.
# Started with -config.expand-env=true: TEMPO_RETENTION comes from deploy/.env.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: ${TEMPO_RETENTION:-168h}

usage_report:
  reporting_enabled: false
