# Local development variant of prometheus.yml, used by apps/server/docker-compose.yml (profile `observability`):
# the API runs on the host (pnpm -C apps/server dev), so it is scraped through host.docker.internal.
# Same rules and job names as production, so alerts and the Grafana dashboard behave the same.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    static_configs:
      # METRICS_PORT of apps/server/.env.
      - targets: ["host.docker.internal:9464"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
