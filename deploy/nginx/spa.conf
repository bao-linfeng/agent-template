# Static SPA server for the admin and client images (nginx-unprivileged listens on 8080 as a non-root user).
# TLS, HSTS and the public hostnames are handled by the gateway in front (deploy/Caddyfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Redirects (e.g. /buildy -> /buildy/) must not leak the internal port behind the gateway.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's content-hashed bundles never change under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # BuildY (client only, public/buildy): a static page builder full of inline scripts that runs the
    # Tailwind 3 CDN build in the browser, so it gets its own policy with inline scripts allowed.
    location /buildy/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # History-mode routes fall back to index.html, which must be revalidated so new releases load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
