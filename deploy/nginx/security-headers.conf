# Included in every location: nginx drops server-level add_header directives once a location adds its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Scripts only from the app itself (no inline scripts: the client's theme bootstrap is /theme-init.js).
# Styles may be inline (component libraries inject <style>), fonts and their CSS come from Google Fonts
# (client font picker), images from any https host (avatars on the API domain, demo pictures), and API
# calls go to the API domain baked into the bundle, so connect-src allows https.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
