# Single-host production stack: Caddy (HTTPS) → api / admin / client, plus PostgreSQL (pgvector), Redis and RustFS.
# Run every command from this directory with deploy/.env in place (cp .env.example .env). See README.md.
#
#   scripts/deploy.sh [tag]            # pull images, back up, migrate, then roll out
#   docker compose run --rm seed       # once: system roles + first super admin (SEED_ADMIN_*)
#
# Only the gateway publishes ports; databases and app containers stay on the internal network.
# Optional monitoring (Prometheus, Alertmanager, Grafana, Tempo): COMPOSE_PROFILES=observability in deploy/.env.
name: agent-template

# Rotated container logs (docker compose logs still works): at most LOG_MAX_FILES × LOG_MAX_SIZE per container.
# Applies when a container is (re)created; the driver is explicit so a different daemon default does not apply.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-5}"

x-server: &server
  logging: *logging
  image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY in deploy/.env}/server:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: apps/server/Dockerfile
  # Secrets and optional tuning (JWT_SECRET, ENCRYPTION_KEY, SMTP_*, THROTTLE_*, SEED_* ...).
  env_file: .env
  # Values derived from the stack; these win over env_file.
  environment:
    NODE_ENV: production
    TRUST_PROXY: "true"
    API_PREFIX: ${API_PREFIX:-api}
    PUBLIC_URL: https://${API_DOMAIN:?set API_DOMAIN}
    APP_WEB_URL: https://${CLIENT_DOMAIN:?set CLIENT_DOMAIN}
    CORS_ORIGINS: https://${ADMIN_DOMAIN:?set ADMIN_DOMAIN},https://${CLIENT_DOMAIN}
    # Use URL-safe passwords (e.g. openssl rand -hex 32): they are embedded in connection URLs.
    DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
    STORAGE_ENDPOINT: http://rustfs:9000
    STORAGE_FORCE_PATH_STYLE: "true"

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - admin
      - client

  api:
    <<: *server
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # One-off tasks (profile `ops` keeps them out of `docker compose up`).
  migrate:
    <<: *server
    profiles: ["ops"]
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *server
    profiles: ["ops"]
    restart: "no"
    command: ["node", "dist/scripts/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    image: ${IMAGE_REGISTRY}/admin:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_SERVER_API_URL: https://${API_DOMAIN}
        VITE_SERVER_API_PREFIX: /${API_PREFIX:-api}
    restart: unless-stopped
    logging: *logging

  client:
    image: ${IMAGE_REGISTRY}/client:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}/${API_PREFIX:-api}
    restart: unless-stopped
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    # BullMQ needs noeviction; AOF keeps queued jobs across restarts.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-o",
          "/dev/null",
          "http://127.0.0.1:9000/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Monitoring (profile `observability`: COMPOSE_PROFILES=observability in deploy/.env, see README.md) ---
  # Prometheus scrapes api:9464 and evaluates observability/prometheus/rules; Alertmanager sends email and,
  # through alert-relay, WeCom/Feishu/DingTalk bot messages; the API exports traces to Tempo when
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318. Only Grafana publishes a port, on 127.0.0.1 (SSH tunnel).
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    # Renders the receivers from these variables (Alertmanager cannot read the environment itself).
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_WECOM_WEBHOOK_URL: ${ALERT_WECOM_WEBHOOK_URL:-}
      ALERT_FEISHU_WEBHOOK_URL: ${ALERT_FEISHU_WEBHOOK_URL:-}
      ALERT_DINGTALK_WEBHOOK_URL: ${ALERT_DINGTALK_WEBHOOK_URL:-}
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Alertmanager webhook → IM group bot formats (observability/alert-relay/relay.mjs, no dependencies).
  alert-relay:
    image: node:24-alpine
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    user: node
    command: ["node", "/app/relay.mjs"]
    environment:
      ALERT_TIMEZONE: ${ALERT_TIMEZONE:-Asia/Shanghai}
      ALERT_WECOM_WEBHOOK_URL: ${ALERT_WECOM_WEBHOOK_URL:-}
      ALERT_FEISHU_WEBHOOK_URL: ${ALERT_FEISHU_WEBHOOK_URL:-}
      ALERT_FEISHU_SECRET: ${ALERT_FEISHU_SECRET:-}
      ALERT_DINGTALK_WEBHOOK_URL: ${ALERT_DINGTALK_WEBHOOK_URL:-}
      ALERT_DINGTALK_SECRET: ${ALERT_DINGTALK_SECRET:-}
    volumes:
      - ./observability/alert-relay:/app:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:3.1.0
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-168h}
    volumes:
      - ./observability/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    # Refuses to start without an admin password instead of falling back to admin/admin.
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then echo "set GRAFANA_ADMIN_PASSWORD in deploy/.env" >&2; exit 1; fi; exec /run.sh',
      ]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Only applied when the grafana-data volume is created; later: grafana cli admin reset-admin-password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test:
        ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  tempo-data:
  grafana-data:
