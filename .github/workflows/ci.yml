name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version comes from the root package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check-types

      - run: pnpm test

      - run: pnpm build

      # Fails when src/database/schema changed without a generated migration in apps/server/drizzle.
      - name: Migrations match the Drizzle schema
        run: |
          pnpm -C apps/server exec drizzle-kit generate --name ci-schema-drift
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            git status --porcelain apps/server/drizzle
            echo "::error::Schema changes without a migration: run pnpm -C apps/server db:generate --name <change> and commit it."
            exit 1
          fi

  e2e:
    name: Server e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # testcontainers uses the runner's Docker daemon.
      - run: pnpm test:e2e

  observability:
    name: Monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/observability
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Alert relay tests
        run: node --test alert-relay/relay.test.mjs

      # Same images as deploy/docker-compose.yml, so Renovate updates cannot drift from what is tested.
      - name: Prometheus config and alert rule tests
        run: |
          image="$(grep -oE 'prom/prometheus:[^ "]+' ../docker-compose.yml)"
          run() { docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool "$image" "$@"; }
          run check config /etc/prometheus/prometheus.yml
          run test rules /etc/prometheus/tests/api.test.yml

      - name: Alertmanager config renders
        run: |
          image="$(grep -oE 'prom/alertmanager:[^ "]+' ../docker-compose.yml)"
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/sh \
            -e ALERT_EMAIL_TO=ops@example.com -e MAIL_FROM='Ops <ops@example.com>' \
            -e SMTP_HOST=smtp.example.com -e SMTP_PORT=465 -e SMTP_SECURE=true \
            -e SMTP_USER=ops -e SMTP_PASSWORD="it's \$ecret" \
            -e ALERT_WECOM_WEBHOOK_URL=https://example.com -e ALERT_FEISHU_WEBHOOK_URL=https://example.com \
            -e ALERT_DINGTALK_WEBHOOK_URL=https://example.com \
            "$image" /etc/alertmanager/entrypoint.sh check
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/sh \
            "$image" /etc/alertmanager/entrypoint.sh check

  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            build-args: ""
          # Placeholder URLs: CI only proves the images build; release.yml bakes the real ones.
          - app: admin
            build-args: VITE_SERVER_API_URL=https://api.example.com
          - app: client
            build-args: VITE_API_BASE_URL=https://api.example.com/api
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: ${{ matrix.build-args }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
