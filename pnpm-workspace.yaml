packages:
  - "apps/*"
  - "packages/*"

# Versions shared by more than one workspace (admin, client, docs, @repo/*). Reference them as `catalog:`.
catalog:
  "@antfu/eslint-config": ^9.5.1
  "@lucide/vue": ^1.46.0
  "@tailwindcss/vite": ^4.3.3
  "@vitejs/plugin-vue": ^6.0.9
  "@vitest/coverage-v8": ^4.1.11
  "@vue/test-utils": ^2.5.1
  "@vueuse/core": ^14.4.0
  class-variance-authority: ^0.7.1
  eslint: ^10.10.0
  eslint-plugin-format: ^2.0.1
  happy-dom: ^20.14.5
  reka-ui: ^2.10.4
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ~6.0.3
  vaul-vue: ^0.4.1
  vite: ^8.3.0
  vitest: ^4.1.11
  vue: ^3.5.42
  vue-router: ^5.3.1
  vue-sonner: ^2.0.9
  vue-tsc: ^3.3.11

minimumReleaseAge: 1440
shellEmulator: true
allowBuilds:
  "@nestjs/core": true
  "@swc/core": true
  esbuild: true
  maplibre-gl: true
  sharp: true
  vue-demi: true
